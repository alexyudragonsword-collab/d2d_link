[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "d2d-link"
version = "0.11.0"
description = "Behavioural simulation of die-to-die / UCIe short-reach parallel links: forwarded-clock jitter tracking, multi-lane, statistical BER to 1e-27"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Touchstone import goes through the vendored Halo_Serdes reader, which
# needs scikit-rf; the analytic channel path does not.
touchstone = ["scikit-rf>=0.29"]
plot = ["matplotlib>=3.7"]
# the browser GUI (phase 8): d2d-link-gui
gui = ["dash>=3,<5", "plotly>=5.18"]
test = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
d2d-link-gui = "d2d_link.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the specification table, the model presets and the bundled clock profiles
# travel with the package (configs name them as data/...)
d2d_link = ["data/spec/*.yaml", "data/clock_profiles/*.yaml", "gui/assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: the weekly deep-consistency run (a 1e-8 point, ~1 h); excluded by default"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"
# vendored copies are checked against upstream, not re-linted here
extend-exclude = ["src/d2d_link/vendor"]

[tool.ruff.lint]
# Gate on real defects (pyflakes: undefined names, unused imports/vars) and
# syntax errors -- not stylistic churn, same as Halo_Serdes.
select = ["E9", "F"]
