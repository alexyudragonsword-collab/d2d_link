# Advanced package x64 module, 2 mm reach, spare-lane repair of two dead bumps.
data_rate_gtps: 32.0
package:
  kind: advanced
channel:
  kind: analytic
  length_mm: 2.0
lanes:
  count: 64
  skew_sigma_ps: 2.0
  skew_seed: 11
  deskew_step_ps: 1.95
  spare_count: 4
  failed: [12, 40]
  repair: spare
clocking:
  scheme: forwarded_ddr
  pll_profile: data/clock_profiles/bench_markulic16_sspll_40m_10p24g.yaml
  data_path_rj_s: 200.0e-15
  clock_path_rj_s: 200.0e-15
  tree_delay_ps: 15.0
  tree_bw_hz: 25.0e9
  tree_rj_s: 100.0e-15
  track_bw_hz: 2.0e6
tx:
  swing_vpp: 0.4
  bw_hz: 60.0e9          # driver edge bandwidth
rx:
  noise_rms_v: 3.0e-3
sim:
  n_symbols: 100000
  engine: statistical
