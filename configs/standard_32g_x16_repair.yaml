# Standard package x16 module with lane skew and width-degradation repair:
# physical lane 5 is dead, so the module falls back to the intact x8 half.
data_rate_gtps: 32.0
package:
  kind: standard
channel:
  kind: analytic
  length_mm: 20.0
lanes:
  count: 16
  skew_sigma_ps: 3.0
  skew_seed: 7
  deskew_step_ps: 1.95       # 1/16 UI at 32 GT/s
  failed: [5]
  repair: width_degrade
clocking:
  scheme: forwarded_ddr
  pll_profile: data/clock_profiles/bench_markulic16_sspll_40m_10p24g.yaml
  data_path_rj_s: 200.0e-15
  clock_path_rj_s: 200.0e-15
  tree_delay_ps: 30.0
  tree_bw_hz: 20.0e9
  tree_rj_s: 100.0e-15
  track_bw_hz: 2.0e6
tx:
  swing_vpp: 0.4
  bw_hz: 60.0e9          # driver edge bandwidth
rx:
  noise_rms_v: 3.0e-3
sim:
  n_symbols: 100000
  engine: statistical
