name: ci

# lint + tests (four Pythons, the declared dependency floor, and no optional
# extras) + every example at smoke size + vendor drift + the numerical
# fingerprint, on every push / PR.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # pushes are never cancelled: each run's fingerprint job judges the commits
  # its push brought (before..head), and a cancelled run left a range nobody
  # compared (performance round III, third health check)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/ examples/ tools/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor requires-python declares; 3.13 is what the
        # maintainer develops on; the two between must not drift
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[touchstone,plot,test]"
      - name: Tests
        run: pytest -q

  # The browser GUI (phase 8) is an optional extra: its tests build the app
  # and render the sections without a browser; the other jobs never install
  # Dash, which keeps the library free of it.
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,test]"
      - name: GUI tests
        run: pytest -q tests/test_gui.py

  # The declared minimums, not the newest: pyproject promises numpy>=1.26,
  # scipy>=1.11, pyyaml>=6.0, and nothing else ever runs at those versions
  # (the vendored jitter.py carries a trapz/trapezoid shim for numpy 1.x that
  # the newest numpy never exercises).
  test-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the declared minimums
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.*" "scipy==1.11.*" "pyyaml==6.0.*" "pytest>=7" "ruff>=0.4"
          pip install --no-deps -e .
      - name: "Tests at the floor (no optional extras; Touchstone and plots skip)"
        run: pytest -q

  examples:
    # Every example end to end with n_symbols capped (tools/run_examples.py
    # --smoke): catches the run-time drift test_examples.py cannot see --
    # renamed config fields, result keys, shapes -- not the numbers, which the
    # examples-full workflow compares against examples/expected/.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[touchstone,plot,test]"
      - name: Run every example (smoke size)
        run: python tools/run_examples.py --smoke

  # Invariant #6: a change that is not meant to move a number must not move
  # one. The base and the head are fingerprinted on the same runner (bit-exact
  # means the same machine and library versions: a committed baseline would
  # differ in the last bits between machines) and compared. On a pull request
  # the base is the PR's base commit and the escape hatch is the label
  # `numbers-move`; on a push the base is the previous head of the branch (a
  # first push or a force-push: the merge base with main) and the escape hatch
  # is "(numbers-move" in the message of any commit the push brings. Either
  # way the diff is kept as an artifact for the CHANGELOG to explain.
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[touchstone,plot,test]"
      - name: Record the head
        run: python tools/fingerprint.py record head.json
      - name: Pick the base
        id: base
        # PR: its base. Push: the previous head. A new branch's first push or a
        # force-push (before unreachable) compares with the merge base on main
        # -- never skipped silently; no base at all is an error
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          elif [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            sha="$before"
          else
            git fetch --no-tags origin main >/dev/null 2>&1 || true
            sha="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            if [ "$sha" = "$(git rev-parse HEAD)" ]; then sha="$(git rev-parse HEAD^ 2>/dev/null || true)"; fi
            echo "::notice::no previous head for this push; comparing with $sha"
          fi
          if [ -z "$sha" ]; then echo "::error::no base to compare the fingerprint with"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Record the base
        run: |
          git worktree add ../base ${{ steps.base.outputs.sha }}
          pip install --no-deps -e ../base
          (cd ../base && python tools/fingerprint.py record "$GITHUB_WORKSPACE/base.json")
          pip install --no-deps -e .
      - name: Compare
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          python tools/fingerprint.py compare base.json head.json > diff.txt || true
          cat diff.txt
          # A moved range is settled commit by commit (tools/fingerprint_walk.py):
          # unmarked range -> red; every commit marked -> green; mixed -> each
          # commit is fingerprinted and an unmarked one that moved numbers is
          # named and fails. Until 0.13.10 one marked commit waived the whole
          # push (fourth health check). The marker is "(numbers-move" followed
          # by ")", ":" or "," in a commit message, or the PR label.
          python tools/fingerprint_walk.py --base "$BASE" --base-json base.json --head-json head.json --labels "$PR_LABELS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint
          path: |
            head.json
            base.json
            diff.txt
          if-no-files-found: ignore
          retention-days: 30

  # Vendor drift: src/d2d_link/vendor must still match the pinned Halo_Serdes
  # and pll_simulator commits (polar_tx's vendor_check method). The siblings
  # are checked out at exactly the pinned SHAs, so --strict (stale pins fail)
  # is satisfiable here and --fail-on-skip makes an unverified file red
  # rather than a pass.
  vendor-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: d2d_link
      - name: Checkout Halo_Serdes (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/Halo_Serdes
          ref: c13da1e60584538b1cc3324c18266ba5beb76d37
          path: _siblings/Halo_Serdes
      - name: Checkout pll_simulator (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/pll_simulator
          ref: 00e48a2f6f7c11c0b6f106234f1490493d43e082
          path: _siblings/pll_simulator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor drift check
        working-directory: d2d_link
        run: >
          python tools/vendor_check.py --strict --fail-on-skip
          --siblings Halo_Serdes=${{ github.workspace }}/_siblings/Halo_Serdes
          pll_simulator=${{ github.workspace }}/_siblings/pll_simulator
      # the _to16g clock profiles name pll_simulator@00e48a2f as their source:
      # regenerate them from that checkout and compare (fourth health check)
      - name: 16 GHz profiles match the pinned pll_simulator
        working-directory: d2d_link
        run: |
          python -m pip install numpy scipy pyyaml matplotlib   # pllsim imports matplotlib at package import
          python tools/export_profile_to_nyquist.py --check --pllsim ${{ github.workspace }}/_siblings/pll_simulator \
            bench_markulic16_sspll_40m_10p24g bench_wu19_spll_frac_52m_6p253g
