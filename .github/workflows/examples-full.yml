name: examples-full

# Every example at its own size, compared line by line with examples/expected/
# (tools/example_drift.py, Halo_Serdes's method). The docs quote these
# numbers; a change that moves one fails here, with the doc lines that still
# quote the old value listed in the log. When the change is meant to move
# numbers: fix the listed doc lines, then refresh the expected files with
# `python tools/example_drift.py accept <dir>` on a local full-size run or
# on this job's `example-outputs` artifact.
on:
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "configs/**"
      - "src/d2d_link/data/**"
      - "pyproject.toml"
      - "tools/**"
      - ".github/workflows/examples-full.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "configs/**"
      - "src/d2d_link/data/**"
      - "pyproject.toml"
      - "tools/**"
  schedule:
    # weekly: numpy / scipy updates move numbers too
    - cron: "41 3 * * 1"
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[touchstone,plot,test]"
          pip list | grep -i -E "^(numpy|scipy) "
      - name: Run every example (full size)
        run: python tools/run_examples.py --jobs 2 --timeout 2400 --save new
      - name: Compare with examples/expected
        if: always()
        run: python tools/example_drift.py compare new
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-outputs
          path: new/
          retention-days: 14

  # Invariant #3 deep: the weekly 1e-8-class consistency point (1e9 symbols
  # at a 3e-8 operating point, ~30 errors; tests/test_engines_deep.py). The
  # full 1e-8 point (2.5e9 symbols, ~5 h) is a manual dispatch with the
  # environment below changed to D2D_DEEP_SYMBOLS=2500000000 D2D_DEEP_BER=1e-8.
  deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Deep consistency point
        env:
          D2D_DEEP_SYMBOLS: "1000000000"
          D2D_DEEP_BER: "3e-8"
        run: python -m pytest -q -m slow -s tests/test_engines_deep.py

